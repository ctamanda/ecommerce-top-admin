# Configuracao do banco principal (PostgreSQL local)
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = postgres
quarkus.datasource.password = 123456
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/ecommerce-top-admin

# Desabilita Dev Services (nao sobe container automaticamente)
quarkus.devservices.enabled=false

# Estrategia de criacao do schema no boot (ambiente local)
quarkus.hibernate-orm.database.generation=drop-and-create
# quarkus.hibernate-orm.database.generation=none
# quarkus.hibernate-orm.database.generation=update

# Logs SQL para debug local
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=ecommerce-top-admin
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pems

# Mercado Pago (conta real via variaveis de ambiente)
mercado-pago.api-key=${MERCADO_PAGO_API_KEY:}
mercado-pago.notification-url=${MERCADO_PAGO_NOTIFICATION_URL:http://localhost:8080/webhooks/mercado-pago}

# SMTP (email real para recuperacao de senha)
quarkus.mailer.from=${MAIL_FROM:}
quarkus.mailer.host=${MAIL_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.start-tls=${MAIL_START_TLS:REQUIRED}
